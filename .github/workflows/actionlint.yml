# Prueft GitHub-Actions-Workflows auf YAML- und Ausdrucksfehler.
# Das gepinnte offizielle Image bringt shellcheck und pyflakes mit.
name: actionlint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Workflow-Dateien prüfen
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
