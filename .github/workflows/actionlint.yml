# Prueft GitHub-Actions-Workflows auf YAML- und Ausdrucksfehler.
# Das gepinnte offizielle Image bringt shellcheck und pyflakes mit.
name: actionlint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Workflow-Dateien prüfen
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
