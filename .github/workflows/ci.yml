name: ci

# Tests und Routing-Pruefung des permission-guard.
#
# Die Testfaelle bilden Windows-Pfad- und Cmdlet-Semantik ab; die Pruefungen
# selbst sind reine Stringtests und laufen plattformunabhaengig. Die Matrix
# belegt genau das. Node 20 ist die Untergrenze aus package.json, 22 der
# aktuelle Stand.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Node ${{ matrix.node }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["20", "22"]
    steps:
      - name: Auschecken
        uses: actions/checkout@v7

      - name: Node einrichten
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Abhaengigkeiten (npm ci)
        run: npm ci

      # Gegenstueck zu pip_audit: braucht Netz und laeuft deshalb nur in der
      # CI, nicht im lokalen Gate. Ein Lauf genuegt - geprueft wird das
      # Lockfile, nicht die Node-Version.
      - name: Sicherheitspruefung (npm audit)
        if: runner.os == 'Linux' && matrix.node == '22'
        run: npm audit --audit-level=high

      - name: Klassifizierer-Tests
        run: node test/test.mjs

      - name: Verdrahtungstest (Fake-git)
        run: node test/test-wiring.mjs

      - name: Verdrahtung index.js (Plugin)
        run: node test/test-index.mjs

      - name: MCP-Weiterleitung (40 Faelle)
        run: node test/bench-mcp.mjs

      - name: Fallbestand unveraendert
        run: node test/bench-mcp.mjs --change

      - name: Paketinhalt
        run: npm pack --dry-run

      - name: Keine Benutzerpfade und keine Schluessel
        if: runner.os == 'Linux'
        run: |
          if grep -RInE '(/Users/[A-Za-z0-9._-]{3,}/|[A-Za-z]:\\+Users\\+[A-Za-z0-9._-]{3,})' \
               --exclude-dir=node_modules \
               --include='*.js' --include='*.mjs' --include='*.json' --include='*.md' --include='*.ps1' --include='*.py' .; then
            echo "::error::Personenbezogener Pfad gefunden."
            exit 1
          fi
          if grep -RInE '(sk-[A-Za-z0-9]{16,}|oc_sk_[A-Za-z0-9]{8,}|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16})' \
               --exclude-dir=node_modules \
               --include='*.js' --include='*.mjs' --include='*.json' --include='*.md' --include='*.ps1' --include='*.py' .; then
            echo "::error::Moeglicher Zugangsschluessel gefunden."
            exit 1
          fi
          echo "Keine Benutzerpfade oder Schluessel gefunden."

  zeilenenden:
    name: Zeilenenden und BOM
    runs-on: ubuntu-latest
    steps:
      - name: Auschecken
        uses: actions/checkout@v7

      - name: Nur LF und kein BOM in getrackten Textdateien
        run: |
          set -euo pipefail
          fehler=0
          # `git ls-files -z --eol` nennt je Datei die Endung im Index (i/...) und
          # in der Arbeitskopie (w/...) sowie die Attribute aus .gitattributes.
          # -z trennt die Datensaetze mit NUL und schuetzt Dateinamen mit
          # Leerzeichen vor Anfuehrungszeichen. Die Ausgabe nennt nur den
          # Dateinamen, nie den Inhalt.
          # Geprueft wird nur, was .gitattributes auf eol=lf festlegt; *.bat,
          # *.cmd und *.sln tragen dort bewusst eol=crlf.
          while IFS=$'\t' read -r -d '' meta datei; do
            case "$meta" in
              *eol=lf*)
                case "$meta" in
                  i/crlf*|i/mixed*|*" w/crlf"*|*" w/mixed"*)
                    echo "::error::$datei: CRLF statt LF"; fehler=1; continue;;
                esac;;
            esac
            case "$meta" in
              *attr/text*)
                if head -c 3 -- "$datei" | od -An -tx1 | grep -q 'ef bb bf'; then
                  echo "::error::$datei: BOM am Dateianfang"; fehler=1
                fi;;
            esac
          done < <(git ls-files -z --eol)
          exit "$fehler"

  python:
    name: Python (Python ${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
    steps:
      - name: Auschecken
        uses: actions/checkout@v7

      - name: Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Abhaengigkeiten (requirements-dev.txt)
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff Lint
        run: python -m ruff check .

      - name: Ruff Format
        run: python -m ruff format --check .

      - name: Pyright
        run: python -m pyright

      - name: Bekannte Schwachstellen pruefen
        run: python -m pip_audit -r requirements-dev.txt --strict --progress-spinner off

      - name: Tests des Codex-Guards
        run: python -m pytest tests -q
