# Test-Gate fuer permission-guard (S3, 05.11.2026).
# Der Hook entscheidet nur, OB geprueft wird; die Testmenge bleibt vollstaendig.
# Hooks laufen unter Git-Bash: node muss dort im PATH liegen.
# docs/ gehoert dazu: Was nach GitHub geht, wird vorher geprueft - eine Liste
# ohne Ausnahmen ist leichter zu pruefen als eine mit.
prefixes=guard.js index.js reviewer.js audit.js test.mjs bench-mcp.mjs package.json README.md PLANUNG.md docs/ mcp-cases.jsonl .github/ .githooks/
test=node test.mjs && node test-index.mjs
